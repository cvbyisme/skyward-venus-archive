[device]
codename = "venus"
brand = "Xiaomi"
model = "Xiaomi 11"
ab = true
soc = { hans = "骁龙 888 移动平台", hant = "Snapdragon® 888 行動平台", en = "Snapdragon® 888 Mobile Platform" }
os_version_prop = "ro.mi.os.version.incremental"

[display]
# What the panel is: 1440 by 3200 at 120 frames a second, read off this
# phone's own log of the display engine (`msm_drm`: hactive=1440,
# vactive=3200, fps=120). These three lines are NOT that: they are the
# lower mode the panel comes up in, and the program scales by 1440/1080 =
# 1.333 before it draws, so what is on the screen is right even though the
# number below is not the panel's own. Only the source was wrong here; the
# screen was not. Left as it is on purpose -- see devices/venus.md.
width = 1080
height = 2400
density = 420
diagonal = 6.81

[modules]
sources = ["vendor_boot", "vendor_dlkm", "vendor"]
# The touchscreen: ST/FocalTech over SPI, with xiaomi_touch's own node and
# the goodix under-display fingerprint driver beside it.
load = ["xiaomi_touch", "fts_touch_spi_k2"]

# venus is a virtual A/B phone with no recovery partition of its own: its
# recovery ramdisk lives inside boot. The base here is the phone's own boot_a
# as it was dumped from the device, holding the TWRP recovery ramdisk its
# owner already runs (init, adbd, SELinux policy and libraries all present).
[stock]
version = "OS3.0.315.0.WPBCNXM+twrp"
image = "https://github.com/cvbyisme/skyward-venus/releases/download/stock-venus/stock-venus-boot.zip"
recovery = "7e8cbf08c9c87147de28f7a254e1e608fb4e6b2d9b9ef603111417195b0f58b3"
# The ramdisk is a third-party one (TWRP), which the packer refuses unless
# told to build on it anyway.
third_party = true
# The AVB footer names the partition the image fills, which is boot here.
partition = "boot"

# The firmware of the phone's radios lives on the modem partition, which the
# phone's init mounts at /vendor/firmware_mnt before any driver asks for it.
# The WLAN driver looks there, so the recovery mounts it too.
[firmware]
partition = "modem"

[wlan]
# The WCN6855 driver is built into this phone's kernel: CLD80211, the hdd
# state node, the cnss2 probe and cfg80211 all come up before any module is
# loaded, which is what the log of a stock start shows. The two-part module
# route (qca_cld3_wlan) belongs to a kernel that carries it as a module, and
# is not this one -- so nothing is loaded here, and the chip is switched on
# through its own control file instead.
modules = []
# What tells the platform driver it may start the chip. The file has one
# name on this board (`b0000000.qcom,cnss-qca6490`) and another in older
# kernels, so both are written and a missing one is only a line in the log.
# The driver copies exactly three bytes, so the newline is part of the value.
writes = [
    { path = "/sys/devices/platform/soc/b0000000.qcom,cnss-qca6490/fs_ready", value = "1\n" },
    { path = "/sys/kernel/cnss/fs_ready", value = "1\n" },
]
# The chip is switched on by writing ON here, once its firmware is in place;
# OFF lets it go with the WLAN. Without the newline the driver reads a write
# it cannot make sense of.
power = "/dev/wlan"
firmware = [
    { name = "wlan/qca_cld/qca6390/WCNSS_qcom_cfg.ini", path = "/vendor/etc/wifi/qca6390/WCNSS_qcom_cfg.ini" },
    # The phone keeps this address as `wlan0=<twelve hex digits>` and the
    # driver reads `Intf0MacAddress=<the same in capitals>` then `END`, so the
    # file is written rather than copied. persist is only read.
    { name = "wlan/qca_cld/qca6390/wlan_mac.bin", partition = "persist", path = "wlan_mac.bin", as_intf0_mac = true },
]
interface = "wlan0"
supplicant = "/vendor/bin/hw/wpa_supplicant"
libraries = ["/vendor/lib64", "/system/lib64"]
# The name the phone's own supplicant publishes itself under: the version is
# part of it, and the directory looks for exactly this one.
service = "android.hardware.wifi.supplicant@1.3::ISupplicant/default"
probe = "http://connect.rom.miui.com/generate_204"
[update]
server = "https://update.miui.com/updates/miotaV3.php"

# The settings partition the phone keeps its own small state in; the recovery
# mounts it where the phone does, as its bootloader hand-off is read there.
#
# The metadata partition holds the key the whole data partition is encrypted
# with, under the directory the phone's table names for it
# (/metadata/vold/metadata_encryption). Nothing on a phone that encrypts its
# files can be opened until it is mounted, and the phone's own init mounts it
# in its first stage, before anything it starts runs. It is mounted here and
# never written.
[partitions]
mounted = ["persist", "metadata"]

# The key services below are the ones this phone's own build has: the older
# kind of each, over the hardware services' directory. A build of the phone
# with the newer kind instead is not listed here, because this phone has
# none of those programs; the recovery reads the phone's own init files and
# manifests for whatever else holds a key, and starts that.
#
# The secure world reaches back into Android through the listeners this
# daemon registers; without them the key service cannot use any key.
[[service]]
path = "/vendor/bin/qseecomd"
libraries = ["/system/lib64", "/vendor/lib64"]
ready_property = "vendor.sys.listeners.registered"
user = "root"
groups = ["root", "drmrpc"]

# The key service of the newer kind: the builds of this phone whose system is
# Android 13 keep their keys through this one instead, and it speaks over the
# ordinary binder rather than the hardware one. Its own program registers it,
# so it needs nothing else to be up first.
[[service]]
path = "/mnt/system_ext/bin/hwservicemanager"
libraries = ["/mnt/system/system/lib64/bootstrap", "/mnt/system/system/lib64", "/mnt/system_ext/lib64"]
ready_property = "hwservicemanager.ready"
user = "system"
groups = ["system", "readproc"]

# The credential service: it is what the secure world has check a screen
# lock, and the only thing that can hand out the note the key service wants
# before it will use a key that secret guards.
[[service]]
path = "/vendor/bin/hw/android.hardware.gatekeeper@1.0-service-qti"
libraries = ["/system/lib64", "/vendor/lib64"]
ready_hardware_service = "android.hardware.gatekeeper@1.0::IGatekeeper/default"
user = "system"
groups = ["system"]

# The key service, which is the only thing that can use the keys the phone
# wrapped in hardware: the one that opens the data partition.
[[service]]
path = "/vendor/bin/hw/android.hardware.keymaster@4.1-service-qti"
libraries = ["/system/lib64", "/vendor/lib64"]
ready_hardware_service = "android.hardware.keymaster@4.1::IKeymasterDevice/default"
user = "system"
groups = ["system", "drmrpc"]

# The boot control, which says which slot the bootloader starts next and
# switches it, writing where the bootloader reads it. This phone's build of
# the hardware carries the older kind of it, at the version that came before
# the one that also tells where an update stands.
[[service]]
path = "/vendor/bin/hw/android.hardware.boot@1.1-service"
libraries = ["/system/lib64", "/vendor/lib64"]
ready_hardware_service = "android.hardware.boot@1.1::IBootControl/default"
user = "root"
groups = ["root"]
